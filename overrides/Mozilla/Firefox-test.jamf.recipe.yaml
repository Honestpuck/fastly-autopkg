Description: Downloads latest Firefox disk image and builds a package.
Identifier: com.github.fastly.recipes.jamf.Firefox-test
Input:
  API_PASSWORD: '%YOUR_API_PASSWORD_VARIABLE%'
  API_USERNAME: '%YOUR_API_USERNAME_VARIABLE%'
  CATEGORY: Browsers
  GROUP_NAME: '%NAME%-update-smart'
  GROUP_TEMPLATE: JamfSmartGroupTemplate-NeedsUpdateInstall-Test.xml
  JSS_URL: '%YOUR_URL_VARIABLE%'
  NAME: Firefox
  PATCH_ENABLED: 'true'
  PATCH_NAME: '%NAME%'
  PATCH_SOFTWARE_TITLE: '%NAME%'
  PATCH_TEMPLATE: JamfPatchTemplate-SS-Test.xml
  POLICY_CATEGORY: Testing
  POLICY_NAME: '%NAME%'
  POLICY_TEMPLATE: JamfPolicyTemplate-Install-wSS-Test.xml
  SELF_SERVICE_DESCRIPTION: Firefox is a cross-platform web browser.
  SELF_SERVICE_DISPLAY_NAME: '%NAME% - %version%'
  SELF_SERVICE_ICON: '%NAME%.png'
  TESTING_GROUP_NAME: Testing
  UPDATE_PREDICATE: pkg_uploaded == False
MinimumVersion: 0.4.0
ParentRecipe: firefox.pkg.recipe
ParentRecipeTrustInfo:
  non_core_processors:
    MozillaURLProvider:
      git_hash: a28e56e90ebc52512a4b7ec8fe1981bf02e92bc5
      path: ~/Library/AutoPkg/RecipeRepos/com.github.autopkg.recipes/Mozilla/MozillaURLProvider.py
      sha256_hash: c4ce035b1a629c4925a80003899fcf39480e5224b3015613440f07ab96211f17
  parent_recipes:
    com.github.autopkg.download.firefox-rc-en_US:
      git_hash: 00f9b0ea8aa77716c0875f9aff6f1281cbf8d84d
      path: ~/Library/AutoPkg/RecipeRepos/com.github.autopkg.recipes/Mozilla/Firefox.download.recipe
      sha256_hash: 6d17ddeb226c88af7b4bdef7f981634f2da18403e0ebb86afeb5cfbdf4dc5237
    com.github.autopkg.pkg.Firefox_EN:
      path: ~/Library/AutoPkg/RecipeRepos/com.github.autopkg.recipes/Mozilla/firefox.pkg.recipe
      sha256_hash: a1fafce10730e5d42f56843e6c9323d4651c6b3dad0663f6a6468c01b7cc1041
Process:
- Arguments:
    computergroup_name: '%GROUP_NAME%'
    computergroup_template: '%GROUP_TEMPLATE%'
    replace_group: 'true'
  Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
- Arguments:
    API_PASSWORD: '%API_PASSWORD%'
    API_USERNAME: '%API_USERNAME%'
    JSS_URL: '%JSS_URL%'
  Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
- Arguments:
    predicate: '%UPDATE_PREDICATE%'
  Processor: StopProcessingIf
- Arguments:
    icon: '%SELF_SERVICE_ICON%'
    policy_name: '%POLICY_NAME%'
    policy_template: '%POLICY_TEMPLATE%'
    replace_policy: 'true'
  Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
- Arguments:
    API_PASSWORD: '%API_PASSWORD%'
    API_USERNAME: '%API_USERNAME%'
    JSS_URL: '%JSS_URL%'
    patch_icon_policy_name: '%POLICY_NAME%'
    patch_name: '%PATCH_NAME%'
    patch_softwaretitle: '%PATCH_SOFTWARE_TITLE%'
    patch_template: '%PATCH_TEMPLATE%'
    replace_patch: 'true'
  Processor: com.github.grahampugh.jamf-upload.processors/JamfPatchUploader
